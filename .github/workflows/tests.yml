name: Codecs TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          # codecs depends on av, which requires the FFI extension.
          extensions: ffi

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Cache FFmpeg 9.0.1 build
        id: ffmpeg-cache
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ffmpeg-9.0.1
          key: ffmpeg-9.0.1-ubuntu

      - name: Install build deps and libvpx 1.15.0
        # codecs depends on av, which requires the FFI extension and an FFmpeg build
        # matching the bundled headers (lib major version 9). libvpx is built always so
        # the cached FFmpeg libraries can find it at runtime.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake git libtool pkg-config \
            yasm nasm wget unzip libssl-dev \
            libx264-dev libopus-dev

          mkdir -p ~/vpx_sources
          cd ~/vpx_sources
          curl -LO https://github.com/webmproject/libvpx/archive/refs/tags/v1.15.0.tar.gz
          tar xzvf v1.15.0.tar.gz
          cd libvpx-1.15.0

          ./configure --prefix=/usr/local --enable-shared --disable-examples
          make -j$(nproc)
          sudo make install
          sudo ldconfig

          pkg-config --modversion vpx || echo "libvpx not found"

      - name: Build FFmpeg 9.0.1 with libx264, libopus, libvpx 1.15.0
        if: matrix.os == 'ubuntu-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          wget https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz
          tar xJf ffmpeg-9.0.1.tar.xz
          cd ffmpeg-9.0.1
          ./configure --prefix="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1" \
            --enable-shared --enable-gpl --enable-libx264 --enable-libopus --enable-libvpx
          make -j$(nproc)
          make install

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress

      - name: Run PHPUnit tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Point the AVCodec bindings at the cached FFmpeg 9 build; the default scan
            # would pick the distro's FFmpeg 6 from /usr/lib instead.
            FFMPEG_PREFIX="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1"
            export LD_LIBRARY_PATH="$FFMPEG_PREFIX/lib:$LD_LIBRARY_PATH"
            export LIB_AVCODEC_PATH="$FFMPEG_PREFIX/lib/libavcodec.so"
            export LIB_AVFORMAT_PATH="$FFMPEG_PREFIX/lib/libavformat.so"
            export LIB_AVFILTER_PATH="$FFMPEG_PREFIX/lib/libavfilter.so"
            vendor/bin/phpunit
          else
            vendor/bin/phpunit -c phpunit-skiptolerant.xml
          fi
        shell: bash
